    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered:', registration);

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New content available, please refresh.');
                    if (confirm('Une nouvelle version est disponible. Voulez-vous recharger?')) {
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch(err => console.log('SW registration failed:', err));
        });
      }

      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('Install prompt available');

        const installBtn = document.createElement('button');
        installBtn.innerHTML = '📱 Installer l\'application';
        installBtn.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;padding:12px 24px;border:none;border-radius:12px;font-weight:600;box-shadow:0 4px 20px rgba(245,158,11,0.4);cursor:pointer;font-size:14px;';
        installBtn.onclick = async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response: ${outcome}`);
            deferredPrompt = null;
            installBtn.remove();
          }
        };
        document.body.appendChild(installBtn);

        setTimeout(() => installBtn.remove(), 30000);
      });

      window.addEventListener('appinstalled', () => {
        console.log('PWA installed successfully');
        deferredPrompt = null;
      });
    </script>
